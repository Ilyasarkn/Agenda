name: Ochtendmelding
on:
  schedule:
    - cron: "30 5 * * *"   # 6u30 in de winter, 7u30 in de zomer (Brussel)
  workflow_dispatch: {}      # knop "Run workflow" om te testen
jobs:
  melding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/ochtend.py
        env:
          KUL_ICS: ${{ secrets.KUL_ICS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
